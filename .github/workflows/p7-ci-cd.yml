name: P7 CI-CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  AKS_RESOURCE_GROUP: rg-sa-p6
  AKS_CLUSTER_NAME: aks-sa-p6
  K8S_NAMESPACE: sa-p6

jobs:

  # ============================================================
  # FASE 1 - BUILD Y VALIDACION
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar dependencias Node
        run: |
          npm ci --prefix P5/auth-service
          npm ci --prefix P5/cursos-service
          npm ci --prefix P5/gateway

      - name: Validar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r P5/estudiantes-service/requirements.txt
          pip install -r P5/inscripciones-service/requirements.txt
          pip install -r P5/cronjobs/requirements.txt


  # ============================================================
  # FASE 2 - TEST
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas automaticas
        run: |
          python P7/tests/test_services.py


  # ============================================================
  # FASE 3 - DOCKER BUILD + PUSH GHCR
  # ============================================================
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar nombres de imagen
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Build y Push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./P5/auth-service
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/auth-service:${{ env.IMAGE_TAG }}

      - name: Build y Push cursos-service
        uses: docker/build-push-action@v6
        with:
          context: ./P5/cursos-service
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/cursos-service:${{ env.IMAGE_TAG }}

      - name: Build y Push estudiantes-service
        uses: docker/build-push-action@v6
        with:
          context: ./P5/estudiantes-service
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/estudiantes-service:${{ env.IMAGE_TAG }}

      - name: Build y Push inscripciones-service
        uses: docker/build-push-action@v6
        with:
          context: ./P5/inscripciones-service
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/inscripciones-service:${{ env.IMAGE_TAG }}

      - name: Build y Push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./P5/gateway
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/gateway:${{ env.IMAGE_TAG }}

      - name: Build y Push cronjobs
        uses: docker/build-push-action@v6
        with:
          context: ./P5/cronjobs
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/cronjobs:${{ env.IMAGE_TAG }}


  # ============================================================
  # FASE 4 - DEPLOY AUTOMATICO A AKS
  # Solo tags v*
  # ============================================================
  deploy:
    name: Deploy AKS
    runs-on: ubuntu-latest
    needs: docker

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verificar e iniciar AKS
        shell: bash
        run: |
          STATE=$(az aks show \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --query "powerState.code" \
            -o tsv)

          echo "Estado actual de AKS: $STATE"

          if [ "$STATE" = "Stopped" ]; then
            echo "El cluster esta detenido. Iniciando..."
            az aks start \
              --resource-group "$AKS_RESOURCE_GROUP" \
              --name "$AKS_CLUSTER_NAME"
          else
            echo "El cluster ya esta activo. Continuando..."
          fi

      - name: Obtener credenciales AKS
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Verificar nodos
        run: kubectl get nodes

      - name: Instalar Helm
        uses: azure/setup-helm@v4

      - name: Preparar values CI/CD
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          cat > /tmp/p7-values.yaml <<EOF
          auth-service:
            image:
              repository: ghcr.io/$OWNER/auth-service
              tag: "${GITHUB_REF_NAME}"
              pullPolicy: Always

          cursos-service:
            image:
              repository: ghcr.io/$OWNER/cursos-service
              tag: "${GITHUB_REF_NAME}"
              pullPolicy: Always

          estudiantes-service:
            image:
              repository: ghcr.io/$OWNER/estudiantes-service
              tag: "${GITHUB_REF_NAME}"
              pullPolicy: Always

          inscripciones-service:
            image:
              repository: ghcr.io/$OWNER/inscripciones-service
              tag: "${GITHUB_REF_NAME}"
              pullPolicy: Always

          gateway:
            image:
              repository: ghcr.io/$OWNER/gateway
              tag: "${GITHUB_REF_NAME}"
              pullPolicy: Always

            service:
              type: LoadBalancer
              port: 3000
              targetPort: 3000
          EOF

      - name: Actualizar imagen de CronJobs
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i "s#acrsa201901385.azurecr.io/cronjobs:p6#ghcr.io/$OWNER/cronjobs:${GITHUB_REF_NAME}#g" P6/charts/sa-platform/templates/cronjobs.yaml

      - name: Actualizar dependencias Helm
        working-directory: P6/charts/sa-platform
        run: helm dependency update

      - name: Desplegar con Helm
        working-directory: P6/charts/sa-platform
        env:
          DB_PASSWORD: ${{ secrets.P7_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.P7_JWT_SECRET }}
          RABBITMQ_PASSWORD: ${{ secrets.P7_RABBITMQ_PASSWORD }}
          RABBITMQ_COOKIE: ${{ secrets.P7_RABBITMQ_COOKIE }}
        run: |
          helm upgrade --install sa-platform . \
            --namespace "$K8S_NAMESPACE" \
            -f /tmp/p7-values.yaml \
            --set secrets.DB_USER=sa_user \
            --set secrets.DB_PASSWORD="$DB_PASSWORD" \
            --set secrets.JWT_SECRET="$JWT_SECRET" \
            --set secrets.RABBITMQ_USERNAME=sa_rabbit \
            --set secrets.RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --set secrets.RABBITMQ_ERLANG_COOKIE="$RABBITMQ_COOKIE" \
            --wait \
            --timeout 10m

      - name: Verificar despliegue
        run: |
          kubectl get pods -n "$K8S_NAMESPACE"
          kubectl get svc -n "$K8S_NAMESPACE"


