name: P8 Secure GitOps

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  packages: write
  security-events: write

env:
  REGISTRY: acrsa201901385.azurecr.io
  IMAGE_PREFIX: acrsa201901385.azurecr.io

jobs:

  # ==========================================================
  # VALIDACION
  # ==========================================================

  validate:
    name: Validate P8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm dependency build
        working-directory: P8/charts/sa-platform
        run: helm dependency build

      - name: Helm lint
        working-directory: P8/charts/sa-platform
        run: helm lint . -f values.yaml

      - name: Helm template
        working-directory: P8/charts/sa-platform
        run: helm template sa-platform . -f values.yaml > /tmp/p8-rendered.yaml

      - name: Reject latest
        run: |
          if grep -E 'image:.*:latest([[:space:]]|$)' /tmp/p8-rendered.yaml; then
            echo "ERROR: latest detectado"
            exit 1
          fi

      - name: Require resources
        run: |
          grep -q "limits:" /tmp/p8-rendered.yaml
          grep -q "requests:" /tmp/p8-rendered.yaml

      - name: Require non-root
        run: |
          grep -q "runAsNonRoot: true" /tmp/p8-rendered.yaml


  # ==========================================================
  # SECURITY - TRIVY
  # ==========================================================

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  # ==========================================================
  # BUILD + SBOM + COSIGN
  # ==========================================================

  build:
    name: Build Sign and SBOM
    runs-on: ubuntu-latest
    needs: security

    strategy:
      matrix:
        include:
          - image: auth-service
            context: P5/auth-service
          - image: cursos-service
            context: P5/cursos-service
          - image: estudiantes-service
            context: P5/estudiantes-service
          - image: inscripciones-service
            context: P5/inscripciones-service
          - image: gateway
            context: P5/gateway
          - image: cronjobs
            context: P5/cronjobs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate image SBOM
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          syft "${IMAGE_PREFIX}/${{ matrix.image }}:${VERSION}" \
            -o spdx-json \
            > "${{ matrix.image }}-${VERSION}-sbom.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: "${{ matrix.image }}-*.spdx.json"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        env:
          COSIGN_YES: "true"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cosign sign "${IMAGE_PREFIX}/${{ matrix.image }}:${VERSION}"

      - name: Verify image signature
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_PREFIX}/${{ matrix.image }}:${VERSION}"


  # ==========================================================
  # K6 - VALIDACION AUTOMATIZADA
  # ==========================================================

  tests:
    name: k6 Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Validate P8_TEST_URL
        shell: bash
        run: |
          if [ -z "${{ vars.P8_TEST_URL }}" ]; then
            echo "ERROR: P8_TEST_URL no estÃ¡ configurada."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.P8_TEST_URL }}
        run: |
          k6 run P8/tests/k6/smoke.js

      - name: Integration test
        env:
          BASE_URL: ${{ vars.P8_TEST_URL }}
        run: |
          k6 run P8/tests/k6/integration.js

      - name: Load test
        env:
          BASE_URL: ${{ vars.P8_TEST_URL }}
        run: |
          k6 run P8/tests/k6/load.js


  # ==========================================================
  # GITOPS - ACTUALIZAR VERSION
  # ==========================================================

  gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: [build, tests]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: BillyDread1531/Practica-SA-P8-GitOps
          token: ${{ secrets.P8_GITOPS_TOKEN }}
          path: P8-GitOps

      - name: Update image versions
        shell: bash
        working-directory: P8-GitOps
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("environments/dev/values.yaml")
          text = path.read_text()

          version = os.environ["VERSION"]

          text = re.sub(
              r'(tag:\s*)"[^"]+"',
              rf'\1"{version}"',
              text
          )

          path.write_text(text)
          PY

      - name: Create automatic GitOps PR
        working-directory: P8-GitOps
        env:
          GH_TOKEN: ${{ secrets.P8_GITOPS_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "automation/update-images-${VERSION}"

          git add environments/dev/values.yaml

          git commit -m "chore: update images to ${VERSION}"

          git push origin "automation/update-images-${VERSION}"

          gh pr create \
            --base main \
            --head "automation/update-images-${VERSION}" \
            --title "chore: update images to ${VERSION}" \
            --body "Automated GitOps image update generated by P8 CI."

