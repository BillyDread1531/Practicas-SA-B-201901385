replicaCount: 2

consumer:
  replicaCount: 1

image:
  repository: acrsa201901385.azurecr.io/inscripciones-service
  tag: "p6"
  pullPolicy: IfNotPresent

fullnameOverride: "inscripciones-service"

service:
  type: ClusterIP
  port: 3003
  targetPort: 3003

config:
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "academia"
  LOG_LEVEL: "info"

  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_QUEUE: "inscripciones.events"

secret:
  name: "sa-platform-secrets"

serviceAccount:
  name: "inscripciones-service-sa"

resources:
  requests:
    cpu: 75m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 192Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

probes:
  startup:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 12

  readiness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
