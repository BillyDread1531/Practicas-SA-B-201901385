global:
  namespace: sa-p6

replicaCount: 2

image:
  repository: acrsa201901385.azurecr.io/cursos-service
  tag: "p6"
  pullPolicy: IfNotPresent

fullnameOverride: "cursos-service"

service:
  type: ClusterIP
  port: 3002
  targetPort: 3002

config:
  PORT: "3002"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "academia"
  LOG_LEVEL: "info"

secret:
  name: "sa-platform-secrets"

serviceAccount:
  name: "cursos-service-sa"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

probes:
  startup:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 12

  readiness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3

  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
