global:
  namespace: sa-p5
  environment: dev
  logLevel: info

nameOverride: ""
fullnameOverride: ""

auth-service:
  enabled: true

cursos-service:
  enabled: true

estudiantes-service:
  enabled: true

inscripciones-service:
  enabled: true

gateway:
  enabled: true

postgresql:
  enabled: true
  namespaceOverride: sa-p5
  fullnameOverride: postgresql

  auth:
    enablePostgresUser: true
    username: sa_user
    database: academia
    existingSecret: sa-platform-secrets
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  primary:
    networkPolicy:
      enabled: false

    initdb:
      scriptsConfigMap: sa-platform-db-init

    persistence:
      enabled: true
      size: 1Gi

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 384Mi

rabbitmq:
  enabled: true
  namespaceOverride: sa-p5
  fullnameOverride: rabbitmq

  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1

  networkPolicy:
    enabled: false

  auth:
    username: sa_rabbit
    existingPasswordSecret: sa-platform-secrets
    existingSecretPasswordKey: rabbitmq-password
    existingErlangSecret: sa-platform-secrets
    existingSecretErlangKey: rabbitmq-erlang-cookie

  persistence:
    enabled: true
    size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi

secrets:
  DB_USER: "CAMBIAR"
  DB_PASSWORD: "CAMBIAR"
  JWT_SECRET: "CAMBIAR"
  RABBITMQ_USERNAME: "CAMBIAR"
  RABBITMQ_PASSWORD: "CAMBIAR"
  RABBITMQ_ERLANG_COOKIE: "CAMBIAR"
