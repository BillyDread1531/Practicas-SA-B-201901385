{{- $global := .Values.global | default (dict) -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ $global.namespace | default "sa-p8" }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}

spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: gateway

  strategy:
    canary:
      # Sin stableService/canaryService: con esos definidos pero SIN un
      # trafficRouting (Istio/Nginx/SMI, que este cluster de un nodo no
      # tiene), Argo Rollouts fija el Service "gateway" a los pods
      # estables unicamente y el canary nunca recibe trafico real, asi que
      # el AnalysisTemplate siempre mide NaN. Sin esos dos campos, el unico
      # Service "gateway" selecciona por las labels comunes (sin el hash) y
      # Kubernetes reparte el trafico de forma nativa entre pods estables y
      # canary segun su proporcion real de replicas: canary basico, sin
      # malla de servicio.
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: gateway-metrics
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Canary
        - pause:
            duration: 20s

        - setWeight: 50
        - analysis:
            templates:
              - templateName: gateway-metrics
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Canary
        - pause:
            duration: 20s

        - setWeight: 80
        - analysis:
            templates:
              - templateName: gateway-metrics
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Canary
        - pause:
            duration: 20s

        - setWeight: 100
        - analysis:
            templates:
              - templateName: gateway-metrics
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Canary

  template:
    metadata:
      labels:
        app.kubernetes.io/instance: sa-platform-dev
        app.kubernetes.io/name: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Practica 10: con esto Prometheus descubre tanto los pods estables
        # como los canary (cada revision trae su propia etiqueta
        # rollouts-pod-template-hash, que el job kubernetes-pods promueve a
        # etiqueta de metrica; asi el AnalysisTemplate puede filtrar SOLO
        # por el canary).
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "gateway.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secret.name }}

          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

