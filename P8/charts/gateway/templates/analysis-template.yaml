{{- $global := .Values.global | default (dict) -}}
# ---------------------------------------------------------------------------
# Practica 10 - requisito 2.2: el analisis del canary ya NO ejecuta un Job de
# pruebas sinteticas contra /health (eso era P8). Ahora consulta Prometheus
# con metricas REALES del trafico que recibe la version candidata: tasa de
# error y percentil 95 de latencia, medidas SOLO sobre los pods canary
# (filtrados por rollouts-pod-template-hash, que Argo Rollouts inyecta como
# argumento {{"{{args.canary-hash}}"}} en cada paso del Rollout).
#
# Esto cierra el pendiente deliberado de P8: la promocion depende del
# comportamiento real del sistema bajo trafico de usuarios, no de un script
# que el propio estudiante escribio.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: gateway-metrics
  namespace: {{ $global.namespace | default "sa-p8" }}
spec:
  args:
    - name: canary-hash

  metrics:
    - name: tasa-de-error
      # 12 mediciones cada 20s = 240s de observacion por paso del canary. En
      # este cluster de un solo nodo (compartido con todo el stack de
      # observabilidad), un pod canary recien creado puede tardar bastante
      # mas que unos segundos en quedar Ready y en que Prometheus lo
      # scrapee por primera vez (se midio hasta ~110s en la practica, por
      # contencion de CPU), asi que las mediciones iniciales salen en NaN y
      # no deben tumbar todo el analisis como "Inconclusive": se tolera
      # hasta 9 de las 12, dejando margen de sobra para que las mediciones
      # con datos reales (una vez el canary recibe trafico) decidan.
      interval: 20s
      count: 12
      failureLimit: 1
      inconclusiveLimit: 9
      # Exito si el error rate del canary es menor al 10%. El fallo inducido
      # (CANARY_FAULT_INJECTION) produce ~50%, muy por encima del umbral.
      successCondition: result < 0.10
      failureCondition: result >= 0.10
      provider:
        prometheus:
          address: http://prometheus-server.observability.svc.cluster.local
          timeout: 10
          query: |
            scalar(
              (sum(rate(http_requests_total{service="gateway", rollouts_pod_template_hash="{{"{{args.canary-hash}}"}}", status_code=~"5.."}[2m])) or vector(0))
              /
              (sum(rate(http_requests_total{service="gateway", rollouts_pod_template_hash="{{"{{args.canary-hash}}"}}"}[2m])) + 0.001)
            )

    - name: latencia-p95
      interval: 20s
      count: 12
      failureLimit: 1
      inconclusiveLimit: 9
      # Exito si el p95 del canary es menor a 1 segundo. El fallo inducido
      # agrega 2000ms fijos, muy por encima del umbral.
      successCondition: result < 1
      failureCondition: result >= 1
      provider:
        prometheus:
          address: http://prometheus-server.observability.svc.cluster.local
          timeout: 10
          query: |
            scalar(
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket{service="gateway", rollouts_pod_template_hash="{{"{{args.canary-hash}}"}}"}[2m])) by (le)
              )
            )
