{{- $global := .Values.global | default (dict) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway.fullname" . }}-config
  namespace: {{ $global.namespace | default "sa-p8" }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
