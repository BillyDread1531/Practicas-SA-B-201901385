apiVersion: apps/v1
kind: Deployment
metadata:
  name: inscripciones-consumer
  namespace: {{ .Values.global.namespace | default "sa-p8" }}
  labels:
    app.kubernetes.io/name: inscripciones-consumer

spec:
  replicas: {{ .Values.consumer.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: inscripciones-consumer

  template:
    metadata:
      labels:
        app.kubernetes.io/name: inscripciones-consumer
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: inscripciones-consumer
              topologyKey: kubernetes.io/hostname

      containers:
        - name: consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - python
            - -m
            - app.consumer

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

          envFrom:
            - configMapRef:
                name: {{ include "inscripciones-service.fullname" . }}-config

            - secretRef:
                name: {{ .Values.secret.name }}

          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; s=socket.create_connection(('rabbitmq',5672),2); s.close()"
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; s=socket.create_connection(('rabbitmq',5672),2); s.close()"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 192Mi

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}