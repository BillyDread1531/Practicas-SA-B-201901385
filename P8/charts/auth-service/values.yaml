global:
  namespace: sa-p8

replicaCount: 2

image:
  repository: acrsa201901385.azurecr.io/auth-service
  tag: "p6"
  pullPolicy: IfNotPresent

fullnameOverride: "auth-service"

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

config:
  PORT: "3001"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "academia"
  LOG_LEVEL: "info"

secret:
  name: "sa-platform-secrets"

serviceAccount:
  create: false
  name: "auth-sa"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  startup:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3

pdb:
  enabled: true
  minAvailable: 1
