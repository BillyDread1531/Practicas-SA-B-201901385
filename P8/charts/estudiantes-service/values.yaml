replicaCount: 2

image:
  repository: acrsa201901385.azurecr.io/estudiantes-service
  tag: "p6"
  pullPolicy: IfNotPresent

fullnameOverride: "estudiantes-service"

service:
  type: ClusterIP
  port: 3004
  targetPort: 3004

config:
  PORT: "3004"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "academia"
  LOG_LEVEL: "info"

secret:
  name: "sa-platform-secrets"

serviceAccount:
  create: false
  name: "estudiantes-sa"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 75m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 192Mi

probes:
  startup:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3

pdb:
  enabled: true
  minAvailable: 1
