apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: p8-require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root execution
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: Containers must explicitly run as non-root.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              kinds:
                - Pod
                - DaemonSet
                - Deployment
                - Job
              namespaces:
                - argocd
                - kyverno
                - velero
                - argo-rollouts
                # Practica 10: stack de observabilidad (Prometheus, Grafana,
                # Loki, Tempo, Promtail, OTel Collector). Igual que los
                # anteriores, es infraestructura de terceros via Helm, no la
                # aplicacion bajo la cadena de suministro de P8.
                - observability
      validate:
        message: "Los contenedores deben ejecutarse como usuario no root."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              securityContext:
                runAsNonRoot: true
          # Velero inyecta el initContainer "restore-wait" al restaurar volumenes
          # (fs-backup); es el unico initContainer exento para no bloquear el DR.
          - list: "request.object.spec.initContainers[?name != 'restore-wait']"
            pattern:
              securityContext:
                runAsNonRoot: true
